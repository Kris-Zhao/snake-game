[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "snake-game"
version = "0.1.0"
description = "A Python Snake game with independently testable rules and Pygame rendering."
requires-python = ">=3.12,<3.13"
dependencies = ["pygame>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["snake_game*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
